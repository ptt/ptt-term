name: Deploy to GitHub Pages
on:
  push:
    branches:
      - prod
      - beta
  workflow_dispatch:
    inputs:
      site:
        description: 'Site to deploy (auto, all, or specific site ID like ptt, ptt2)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - all
          - ptt
          - ptt2

permissions:
  contents: read

jobs:
  load-sites:
    name: Load site configurations
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_sites: ${{ steps.set-matrix.outputs.has_sites }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Load site configurations
        id: set-matrix
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install pyyaml
          python3 .github/workflows/load_sites.py \
            --branch "${{ github.ref_name }}" \
            --site "${{ inputs.site || 'auto' }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ matrix.site.SITE_ID }} (${{ matrix.site.CNAME }})
    needs: load-sites
    if: needs.load-sites.outputs.has_sites == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.load-sites.outputs.matrix) }}
    uses: ./.github/workflows/deploy-ghpage.yml
    with:
      THEME: ${{ matrix.site.THEME }}
      TARGET_REPO: ${{ matrix.site.TARGET_REPO }}
      CNAME: ${{ matrix.site.CNAME }}
      APP_TITLE: ${{ matrix.site.APP_TITLE }}
      APP_SHORT_NAME: ${{ matrix.site.APP_SHORT_NAME }}
      APP_DESCRIPTION: ${{ matrix.site.APP_DESCRIPTION }}
      DYNAMIC_TITLE: ${{ matrix.site.DYNAMIC_TITLE }}
      SITE_URL: ${{ matrix.site.SITE_URL }}
      SITE_TYPE: ${{ matrix.site.SITE_TYPE }}
      DEV_PROXY_TARGET: ${{ matrix.site.DEV_PROXY_TARGET }}
      DEV_PROXY_HEADER: ${{ matrix.site.DEV_PROXY_HEADER }}
      BRANCH: ${{ matrix.site.BRANCH }}
      DEFAULT_PLUGINS: ${{ matrix.site.DEFAULT_PLUGINS }}
    secrets:
      deploy-token: ${{ matrix.site.DEPLOY_TOKEN_SECRET != '' && secrets[matrix.site.DEPLOY_TOKEN_SECRET] || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
